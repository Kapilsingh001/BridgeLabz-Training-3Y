<!DOCTYPE html>
<html lang="en">

<head>

    <!-- <title> defines the title shown in the browser tab -->
    <title>Important Head Elements</title>

    <!-- <meta charset> defines the character encoding of the webpage -->
    <meta charset="UTF-8">

    <!-- <meta name="description"> provides a short description of the webpage -->
    <meta name="description" content="A webpage demonstrating important HTML head elements">

    <!-- <meta name="author"> specifies the author of the webpage -->
    <meta name="author" content="Kapil Singh">

    <!-- <base> sets the base URL for relative links on the webpage -->
    <base href="https://example.com/">

    <!-- <link> connects an external resource such as a favicon to the webpage -->
    <link rel="icon" href="favicon.ico">

    <!-- <style> is used to add CSS styles to the webpage.
         It can be empty as required by the assignment. -->
    <style>
    </style>

    <!-- <script> is used to add JavaScript to the webpage.
         It can be empty as required by the assignment. -->
    <script>
    </script>

</head>

<body>

    <h1>Important HTML Head Elements</h1>

    <p>
        This webpage demonstrates the important elements
        that can be placed inside the HTML head section.
    </p>

</body>

</html>
