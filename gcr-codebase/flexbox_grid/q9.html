<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip Animation</title>

    <!-- Linking the external CSS file -->
    <link rel="stylesheet" href="q9.css">
</head>
<body>

    <!-- Card container -->
    <div class="card-container">

        <!-- Card that flips on hover -->
        <div class="card">

            <!-- Front side of the card -->
            <div class="card-front">
                <img
                    src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=500&q=80"
                    alt="Snowy mountain">
                <h2>Beautiful Mountains</h2>
            </div>

            <!-- Back side of the card -->
            <div class="card-back">
                <h2>About Mountains</h2>
                <p>
                    Mountains are natural landforms that rise high above
                    the surrounding land. They are known for their beauty,
                    diverse wildlife, and breathtaking landscapes.
                </p>
            </div>

        </div>

    </div>

</body>
</html>
