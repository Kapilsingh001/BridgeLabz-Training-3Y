<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>

    <!-- Linking the external CSS file -->
    <link rel="stylesheet" href="q5.css">
</head>
<body>

    <h1>Pricing Plans</h1>

    <!-- Pricing cards container -->
    <main class="pricing-container">

        <!-- Basic Plan -->
        <section class="pricing-card">
            <h2>Basic</h2>
            <p class="price">₹499</p>
            <p>Perfect for getting started.</p>
            <button>Choose Plan</button>
        </section>

        <!-- Pro Plan -->
        <section class="pricing-card featured">
            <h2>Pro</h2>
            <p class="price">₹999</p>
            <p>Best choice for growing users.</p>
            <button>Choose Plan</button>
        </section>

        <!-- Premium Plan -->
        <section class="pricing-card">
            <h2>Premium</h2>
            <p class="price">₹1,499</p>
            <p>For users who need more features.</p>
            <button>Choose Plan</button>
        </section>

    </main>

</body>
</html>
