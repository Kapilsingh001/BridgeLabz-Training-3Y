<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Layout</title>

    <!-- Linking the external CSS file -->
    <link rel="stylesheet" href="q4.css">
</head>
<body>

    <div class="dashboard">

        <!-- Header spans across all columns -->
        <header>
            <h1>My Dashboard</h1>
        </header>

        <!-- Sidebar with vertical navigation -->
        <aside>
            <h2>Menu</h2>

            <nav>
                <a href="#">Dashboard</a>
                <a href="#">Profile</a>
                <a href="#">Settings</a>
                <a href="#">Logout</a>
            </nav>
        </aside>

        <!-- Main content area -->
        <main>

            <div class="box">
                <h2>Users</h2>
                <p>1,250</p>
            </div>

            <div class="box">
                <h2>Orders</h2>
                <p>540</p>
            </div>

            <div class="box wide-box">
                <h2>Revenue</h2>
                <p>₹2,50,000</p>
            </div>

            <div class="box">
                <h2>Projects</h2>
                <p>24</p>
            </div>

        </main>

    </div>

</body>
</html>
