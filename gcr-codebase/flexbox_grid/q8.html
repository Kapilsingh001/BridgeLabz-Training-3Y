<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>

    <!-- Linking the external CSS file -->
    <link rel="stylesheet" href="q8.css">
</head>
<body>

    <h1>Photo Gallery</h1>

    <!-- Photo gallery using CSS Grid -->
    <main class="gallery">

        <figure>
            <img
                src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=600&q=80"
                alt="Beautiful mountain landscape">
            <figcaption>Mountain Landscape</figcaption>
        </figure>

        <figure>
            <img
                src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=600&q=80"
                alt="Mountain and lake">
            <figcaption>Mountain and Lake</figcaption>
        </figure>

        <figure>
            <img
                src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=600&q=80"
                alt="Green forest">
            <figcaption>Green Forest</figcaption>
        </figure>

        <figure>
            <img
                src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80"
                alt="Beach and ocean">
            <figcaption>Beautiful Beach</figcaption>
        </figure>

        <figure>
            <img
                src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=600&q=80"
                alt="Snowy mountains">
            <figcaption>Snowy Mountains</figcaption>
        </figure>

        <figure>
            <img
                src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=600&q=80"
                alt="Nature landscape">
            <figcaption>Nature</figcaption>
        </figure>

    </main>

</body>
</html>
