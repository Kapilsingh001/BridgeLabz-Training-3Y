<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q4 - Theme Switcher</title>
    <link rel="stylesheet" href="q4.css">
</head>
<body class="theme-light" data-theme="light">

    <div class="container">
        <h1>Q4 - Theme Switcher</h1>
        <p>Themes are applied to &lt;body&gt; using setAttribute().</p>

        <div class="theme-buttons" id="themeButtons">
            <button data-theme-name="light">Light</button>
            <button data-theme-name="dark">Dark</button>
            <button data-theme-name="blue">Blue</button>
        </div>

        <div id="themeInfo"></div>
    </div>

    <script src="q4.js"></script>
</body>
</html>
