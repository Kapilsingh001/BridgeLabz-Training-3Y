<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 - Live Character Counter</title>
    <link rel="stylesheet" href="q2.css">
</head>
<body>

    <div class="container">
        <h1>Q2 - Live Character Counter</h1>
        <p>Maximum 100 characters. Counter turns yellow at 20 left and red at 0.</p>

        <textarea id="messageBox" placeholder="Start typing..."></textarea>

        <div class="row">
            <span id="counter">100 characters remaining</span>
            <button id="resetButton">Reset</button>
        </div>
    </div>

    <script src="q2.js"></script>
</body>
</html>
