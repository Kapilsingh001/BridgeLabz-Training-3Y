<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 - Product List Manager</title>
    <link rel="stylesheet" href="q1.css">
</head>
<body>

    <div class="container">
        <h1>Q1 - Product List Manager</h1>
        <p>Add, edit and delete products. Edit/Delete use event delegation on the parent &lt;ul&gt;.</p>

        <div class="add-row">
            <input type="text" id="productInput" placeholder="Enter product name">
            <button id="addButton">Add</button>
        </div>
        <p class="error" id="errorMessage"></p>

        <ul id="productList"></ul>
    </div>

    <script src="q1.js"></script>
</body>
</html>
