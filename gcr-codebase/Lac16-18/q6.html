<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transformations Showcase</title>

    <!-- External CSS file -->
    <link rel="stylesheet" href="q6.css">
</head>

<body>

    <!-- Header section -->
    <header>
        <h1>CSS Transformations Showcase</h1>
        <p>Hover over each box to see the transformation</p>
    </header>

    <!-- Main content -->
    <main>
        <section class="transform-container">

            <!-- Rotate transformation -->
            <article class="transform-item">
                <div class="box rotate-box">
                    Rotate
                </div>
                <p>rotate()</p>
            </article>

            <!-- Scale transformation -->
            <article class="transform-item">
                <div class="box scale-box">
                    Scale
                </div>
                <p>scale()</p>
            </article>

            <!-- Translate transformation -->
            <article class="transform-item">
                <div class="box translate-box">
                    Translate
                </div>
                <p>translate()</p>
            </article>

            <!-- Skew transformation -->
            <article class="transform-item">
                <div class="box skew-box">
                    Skew
                </div>
                <p>skew()</p>
            </article>

        </section>
    </main>

    <!-- Footer section -->
    <footer>
        <p>Assignment 7 - Question 6 | CSS Transformations</p>
    </footer>

</body>
</html>
