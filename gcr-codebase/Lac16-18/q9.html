<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outline and Focus Form</title>

    <!-- External CSS file -->
    <link rel="stylesheet" href="q9.css">
</head>

<body>

    <!-- Header section -->
    <header>
        <h1>Outline & Focus Styling</h1>
        <p>CSS form styling using outlines and focus effects</p>
    </header>

    <!-- Main content -->
    <main>

        <!-- Form section -->
        <section class="form-section">

            <h2>Contact Form</h2>

            <form>

                <!-- Name input -->
                <div class="form-group">
                    <label for="name">Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                    >
                </div>

                <!-- Email input -->
                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                    >
                </div>

                <!-- Message textarea -->
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="5"
                        placeholder="Write your message"
                    ></textarea>
                </div>

                <!-- Submit button -->
                <button type="submit">Submit</button>

            </form>

        </section>

    </main>

    <!-- Footer section -->
    <footer>
        <p>Assignment 7 - Question 9 | Outline and Focus Styling</p>
    </footer>

</body>
</html>
