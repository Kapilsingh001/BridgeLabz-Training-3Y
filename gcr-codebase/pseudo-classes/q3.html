<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Showcase</title>

    <link rel="stylesheet" href="q3.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Image Showcase</h1>
        <p>Hover over an image to see the effect</p>
    </header>


    <!-- Main Gallery -->
    <main class="gallery">

        <!-- Image 1 -->
        <figure>

            <div class="image-box">

                <img
                    src="https://picsum.photos/seed/mountain/600/400"
                    alt="Mountain landscape"
                >

                <div class="overlay"></div>

            </div>

            <figcaption>Mountain</figcaption>

        </figure>


        <!-- Image 2 -->
        <figure>

            <div class="image-box">

                <img
                    src="https://picsum.photos/seed/forest/600/400"
                    alt="Forest landscape"
                >

                <div class="overlay"></div>

            </div>

            <figcaption>Forest</figcaption>

        </figure>


        <!-- Image 3 -->
        <figure>

            <div class="image-box">

                <img
                    src="https://picsum.photos/seed/ocean/600/400"
                    alt="Ocean landscape"
                >

                <div class="overlay"></div>

            </div>

            <figcaption>Ocean</figcaption>

        </figure>


        <!-- Image 4 -->
        <figure>

            <div class="image-box">

                <img
                    src="https://picsum.photos/seed/desert/600/400"
                    alt="Desert landscape"
                >

                <div class="overlay"></div>

            </div>

            <figcaption>Desert</figcaption>

        </figure>


        <!-- Image 5 -->
        <figure>

            <div class="image-box">

                <img
                    src="https://picsum.photos/seed/city/600/400"
                    alt="City view"
                >

                <div class="overlay"></div>

            </div>

            <figcaption>City</figcaption>

        </figure>


        <!-- Image 6 -->
        <figure>

            <div class="image-box">

                <img
                    src="https://picsum.photos/seed/lake/600/400"
                    alt="Lake landscape"
                >

                <div class="overlay"></div>

            </div>

            <figcaption>Lake</figcaption>

        </figure>

    </main>


    <!-- Footer -->
    <footer>
        <p>Assignment 8 - Question 3</p>
    </footer>

</body>

</html>
