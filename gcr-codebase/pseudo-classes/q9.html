<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Combined CSS Effects</title>

    <link rel="stylesheet" href="q9.css">
</head>

<body>

    <!-- Header -->
    <header>

        <h1>Combined CSS Effects</h1>

        <p>
            Hover, transitions and transformations together
        </p>

    </header>


    <!-- Effects -->
    <main class="effects">

        <!-- Card 1 -->
        <button class="effect-card">

            <span>Grow</span>

            <small>Hover me</small>

        </button>


        <!-- Card 2 -->
        <button class="effect-card">

            <span>Shadow</span>

            <small>Hover me</small>

        </button>


        <!-- Card 3 -->
        <button class="effect-card">

            <span>Rotate</span>

            <small>Hover me</small>

        </button>


        <!-- Card 4 -->
        <button class="effect-card">

            <span>Lift</span>

            <small>Hover me</small>

        </button>

    </main>


    <!-- Footer -->
    <footer>

        <p>Assignment 8 - Question 9</p>

    </footer>

</body>

</html>
