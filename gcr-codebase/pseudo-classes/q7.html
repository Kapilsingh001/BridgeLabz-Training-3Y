<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UI Components</title>

    <link rel="stylesheet" href="q7.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Simple UI Components</h1>
    </header>


    <!-- Main Card -->
    <main class="ui-card">

        <h2>Search Products</h2>


        <!-- Search Input -->
        <label for="search">
            Search
        </label>

        <input
            id="search"
            type="search"
            placeholder="Enter a product name"
        >


        <!-- Category Dropdown -->
        <label for="category">
            Category
        </label>

        <select id="category">

            <option>
                Choose a category
            </option>

            <option>
                Electronics
            </option>

            <option>
                Books
            </option>

            <option>
                Clothing
            </option>

        </select>


        <!-- Buttons -->
        <div class="actions">

            <button class="search-btn">
                Search
            </button>

            <button class="clear-btn">
                Clear
            </button>

        </div>

    </main>


    <!-- Footer -->
    <footer>
        <p>Assignment 8 - Question 7</p>
    </footer>

</body>

</html>
