<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Styled Buttons</title>

    <link rel="stylesheet" href="q5.css">
</head>

<body>

    <!-- Header -->
    <header>

        <h1>Styled Button Collection</h1>

        <p>
            Different button states using CSS pseudo-classes
        </p>

    </header>


    <!-- Buttons -->
    <main class="button-container">

        <button class="btn primary">
            Primary
        </button>

        <button class="btn secondary">
            Secondary
        </button>

        <button class="btn outline">
            Outline
        </button>

        <button class="btn" disabled>
            Disabled
        </button>

    </main>


    <!-- Explanation -->
    <section class="info">

        <p>
            <strong>Hover:</strong>
            Move the mouse over a button.
        </p>

        <p>
            <strong>Focus:</strong>
            Click or tab to a button.
        </p>

        <p>
            <strong>Active:</strong>
            Press and hold a button.
        </p>

        <p>
            <strong>Disabled:</strong>
            This button cannot be clicked.
        </p>

    </section>


    <!-- Footer -->
    <footer>

        <p>Assignment 8 - Question 5</p>

    </footer>

</body>

</html>
