<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="q10.css">
</head>

<body>

    <header>
        <h1>Contact Us</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <div class="main-card">

            <h2>Get in Touch</h2>

            <p>
                Have any questions? Fill out the form below and
                we will get back to you.
            </p>

            <img
                src="https://picsum.photos/seed/contact/220/150"
                alt="Contact"
            >

            <form>

                <label for="name">Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="message">Message</label>
                <textarea
                    id="message"
                    rows="5"
                    placeholder="Write your message..."
                ></textarea>

                <div class="form-buttons">
                    <button type="submit">Submit</button>
                    <button type="reset">Reset</button>
                </div>

            </form>

        </div>
    </main>

    <footer>
        <p>© 2026 Contact Us. All rights reserved.</p>
    </footer>

</body>
</html>
