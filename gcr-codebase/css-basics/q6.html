<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>

    <link rel="stylesheet" href="q6.css">
</head>

<body>

    <header>
        <h1>My Photo Gallery</h1>
        <p>A collection of beautiful places</p>
    </header>

    <main>

        <section class="gallery">

            <!-- Image 1 -->
            <figure class="gallery-item">
                <img
                    src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=80"
                    alt="Mountain landscape"
                >
                <figcaption>Mountain Landscape</figcaption>
            </figure>

            <!-- Image 2 -->
            <figure class="gallery-item">
                <img
                    src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80"
                    alt="Beautiful beach"
                >
                <figcaption>Beautiful Beach</figcaption>
            </figure>

            <!-- Image 3 -->
            <figure class="gallery-item">
                <img
                    src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80"
                    alt="Green forest"
                >
                <figcaption>Green Forest</figcaption>
            </figure>

            <!-- Image 4 -->
            <figure class="gallery-item">
                <img
                    src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=800&q=80"
                    alt="Mountain lake"
                >
                <figcaption>Mountain Lake</figcaption>
            </figure>

            <!-- Image 5 -->
            <figure class="gallery-item">
                <img
                    src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=800&q=80"
                    alt="Mountain valley"
                >
                <figcaption>Mountain Valley</figcaption>
            </figure>

            <!-- Image 6 -->
            <figure class="gallery-item">
                <img
                    src="https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=800&q=80"
                    alt="Forest trees"
                >
                <figcaption>Forest Adventure</figcaption>
            </figure>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 My Photo Gallery</p>
    </footer>

</body>

</html>
