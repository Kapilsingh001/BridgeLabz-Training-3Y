<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Filter Cards with Animation</title>

    <link rel="stylesheet" href="filter-cards-with-animation.css">
</head>

<body>

    <header>
        <h1>Our Team</h1>
        <p>Meet our creative team members.</p>
    </header>


    <main>

        <section class="profile-container">

            <article class="profile-card">

                <img src="images/profile1.jpg"
                     alt="Profile of Alex">

                <div class="profile-content">
                    <h2>Alex Johnson</h2>
                    <p>
                        Web Designer who creates clean and
                        user-friendly interfaces.
                    </p>
                </div>

            </article>


            <article class="profile-card">

                <img src="images/profile2.jpg"
                     alt="Profile of Sarah">

                <div class="profile-content">
                    <h2>Sarah Williams</h2>
                    <p>
                        Frontend Developer focused on
                        responsive web applications.
                    </p>
                </div>

            </article>


            <article class="profile-card">

                <img src="images/profile3.jpg"
                     alt="Profile of Michael">

                <div class="profile-content">
                    <h2>Michael Brown</h2>
                    <p>
                        UI/UX Designer passionate about
                        creating engaging experiences.
                    </p>
                </div>

            </article>

        </section>

    </main>


    <footer>
        <p>&copy; 2026 Our Team</p>
    </footer>

</body>

</html>
