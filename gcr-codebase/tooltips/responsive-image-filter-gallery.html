<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Image Filter Gallery</title>

    <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>

<body>

    <header>
        <h1>Responsive Image Filter Gallery</h1>
        <p>Hover over the images to remove the filter effect.</p>
    </header>

    <main>

        <section class="gallery">

            <figure>
                <img src="images/nature1.jpg"
                     alt="Nature image with blur filter"
                     class="blur">

                <figcaption>Blur Filter</figcaption>
            </figure>


            <figure>
                <img src="images/nature2.jpg"
                     alt="Nature image with grayscale filter"
                     class="grayscale">

                <figcaption>Grayscale Filter</figcaption>
            </figure>


            <figure>
                <img src="images/nature3.jpg"
                     alt="Nature image with sepia filter"
                     class="sepia">

                <figcaption>Sepia Filter</figcaption>
            </figure>


            <figure>
                <img src="images/nature4.jpg"
                     alt="Nature image with brightness filter"
                     class="brightness">

                <figcaption>Brightness Filter</figcaption>
            </figure>


            <figure>
                <img src="images/nature5.jpg"
                     alt="Nature image with contrast filter"
                     class="contrast">

                <figcaption>Contrast Filter</figcaption>
            </figure>


            <figure>
                <img src="images/nature6.jpg"
                     alt="Nature image with hue rotate filter"
                     class="hue-rotate">

                <figcaption>Hue Rotate Filter</figcaption>
            </figure>

        </section>

    </main>


    <footer>
        <p>CSS Image Filter Gallery</p>
    </footer>

</body>

</html>
