<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Filter Comparison Layout</title>

    <link rel="stylesheet" href="filter-comparison-layout.css">
</head>

<body>

    <header>
        <h1>Filter Comparison</h1>
        <p>Compare the original image with a filtered version.</p>
    </header>


    <main>

        <section class="comparison">

            <figure class="comparison-card">
                <img src="images/comparison-original.jpg"
                     alt="Original landscape image">

                <figcaption>Before - Original Image</figcaption>
            </figure>


            <figure class="comparison-card">
                <img src="images/comparison-filtered.jpg"
                     alt="Filtered landscape image"
                     class="filtered-image">

                <figcaption>After - Filtered Image</figcaption>
            </figure>

        </section>

    </main>


    <footer>
        <p>CSS Filter Comparison</p>
    </footer>

</body>

</html>
