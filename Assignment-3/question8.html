<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Report Page</title>
</head>

<body>

    <!-- School Name -->
    <h1>ABC Public School</h1>

    <!-- Student Information -->
    <table border="1">

        <tr>
            <th>Student Name</th>
            <td colspan="3">Rahul Sharma</td>
        </tr>

        <tr>
            <th>Class</th>
            <td>12th</td>

            <th>Roll Number</th>
            <td>25</td>
        </tr>

    </table>

    <br>

    <!-- Student Marks Table -->
    <table border="1">

        <!-- Table Heading -->
        <tr>
            <th rowspan="2" title="Name of the subject">
                Subject
            </th>

            <th rowspan="2" title="Marks obtained by the student">
                Marks
            </th>

            <th rowspan="2" title="Maximum marks for the subject">
                Maximum Marks
            </th>

            <th rowspan="2" title="Result status">
                Result
            </th>
        </tr>

        <tr>
            <!-- Empty row because the headings use rowspan -->
        </tr>

        <!-- Subject 1 -->
        <tr>
            <td>English</td>
            <td>85</td>
            <td>100</td>
            <td>Pass</td>
        </tr>

        <!-- Subject 2 -->
        <tr>
            <td>Mathematics</td>
            <td>92</td>
            <td>100</td>
            <td>Pass</td>
        </tr>

        <!-- Subject 3 -->
        <tr>
            <td>Physics</td>
            <td>78</td>
            <td>100</td>
            <td>Pass</td>
        </tr>

        <!-- Subject 4 -->
        <tr>
            <td>Chemistry</td>
            <td>81</td>
            <td>100</td>
            <td>Pass</td>
        </tr>

        <!-- Subject 5 -->
        <tr>
            <td>Computer Science</td>
            <td>95</td>
            <td>100</td>
            <td>Pass</td>
        </tr>

        <!-- Total and Percentage -->
        <tr>
            <th colspan="2">Total</th>
            <td colspan="2">431 / 500</td>
        </tr>

        <tr>
            <th colspan="2">Percentage</th>
            <td colspan="2">86.2%</td>
        </tr>

    </table>

</body>

</html>
